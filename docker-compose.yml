services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cvf
      POSTGRES_USER: cvf
      POSTGRES_PASSWORD: "${CVF_POSTGRES_PASSWORD:-cvf_development_only}"
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvf -d cvf"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - cvf-postgres:/var/lib/postgresql/data

volumes:
  cvf-postgres:
