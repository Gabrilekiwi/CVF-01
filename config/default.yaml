app:
  name: "CVF-01"
  environment: "development"
  strategy_version: "0.3.1"
  status_interval_seconds: 5
  shutdown_timeout_seconds: 10
  paper_trading_only: true

markets:
  canonical_symbols:
    - "BTC-USDT-PERP"
    - "ETH-USDT-PERP"

timing:
  feature_update_seconds: 1
  signal_check_seconds: 5
  feature_windows_seconds: [5, 15, 60]
  statistics_windows_seconds: [1800, 86400]

exchanges:
  binance:
    enabled: true
    rest_url: "https://fapi.binance.com"
    public_websocket_url: "wss://fstream.binance.com"
    symbols:
      BTC-USDT-PERP: "BTCUSDT"
      ETH-USDT-PERP: "ETHUSDT"
    channels:
      - "aggTrade"
      - "bookTicker"
      - "depth@100ms"
      - "markPrice@1s"
      - "forceOrder"
    rest_pollers:
      - "open_interest"
    heartbeat_timeout_seconds: 30
    connect_timeout_seconds: 10
    close_timeout_seconds: 5
    receive_timeout_seconds: 20
    rest_timeout_seconds: 10
    reconnect_initial_seconds: 1
    reconnect_max_seconds: 60
    reconnect_jitter_seconds: 0.5
    reconnect_stable_reset_seconds: 60
    open_interest_poll_seconds: 5
    book_snapshot_depth: 1000
    book_buffer_events: 10000
  okx:
    enabled: true
    rest_url: "https://www.okx.com"
    public_websocket_url: "wss://ws.okx.com:8443/ws/v5/public"
    symbols:
      BTC-USDT-PERP: "BTC-USDT-SWAP"
      ETH-USDT-PERP: "ETH-USDT-SWAP"
    channels:
      - "trades"
      - "books"
      - "open-interest"
      - "funding-rate"
      - "mark-price"
      - "index-tickers"
      - "liquidation-orders"
    rest_pollers:
      - "instrument_metadata"
    heartbeat_timeout_seconds: 30
    connect_timeout_seconds: 10
    close_timeout_seconds: 5
    receive_timeout_seconds: 20
    rest_timeout_seconds: 10
    reconnect_initial_seconds: 1
    reconnect_max_seconds: 60
    reconnect_jitter_seconds: 0.5
    reconnect_stable_reset_seconds: 60
    open_interest_poll_seconds: 5
    book_snapshot_depth: 1000
    book_buffer_events: 10000

features:
  order_book_depth: 5
  order_book_level_weights: [1.0, 0.8, 0.6, 0.4, 0.2]
  trade_imbalance_windows_seconds: [5, 15, 60]
  price_impulse_windows_seconds: [5, 15, 60]
  open_interest_windows_seconds: [15, 60]
  liquidation_windows_seconds: [5, 15, 60]
  breakout_lookback_seconds: 180
  atr_period_seconds: 60
  zscore_lookback_seconds: 1800
  spread_percentile_lookback_seconds: 86400
  state_retention_seconds: 86400
  maximum_events_per_stream: 500000
  late_event_policy: "drop"
  maximum_lateness_ms: 250
  receive_time_reorder_ms: 250
  book_pending_updates: 10000
  large_trade_notional_usdt: 100000
  depth_walk_notional_usdt: 10000
  abnormal_jump_zscore: 4.0
  cross_venue_max_snapshot_age_ms: 2000
  cross_venue_max_time_difference_ms: 500
  cross_venue_zscore_minimum_samples: 30
  cross_venue_direction_epsilon: 1.0e-12
  cross_venue_strength_tolerance: 0.25

health:
  maximum_core_latency_ms: 500
  stale_after_ms: 1500
  clock_skew_warning_ms: 250
  duplicate_cache_size: 10000
  duplicate_ttl_seconds: 300
  open_interest_stale_after_ms: 15000
  channel_stale_after_ms:
    aggTrade: 1500
    bookTicker: 1500
    depth@100ms: 1500
    markPrice@1s: 3000
    forceOrder: null
    open_interest: 15000
    trades: 1500
    books: 1500
    books5: 1500
    open-interest: 15000
    funding-rate: 120000
    mark-price: 3000
    index-tickers: 3000
    liquidation-orders: null
    instrument_metadata: null
  order_book_gap_forces_resync: true
  block_entry_statuses:
    - "STALE"
    - "RESYNCING"
    - "DISCONNECTED"

storage:
  database_url: "sqlite+aiosqlite:///data/cvf.db"
  raw_data_path: "data/raw"
  processed_data_path: "data/processed"
  parquet_batch_rows: 10000
  parquet_flush_seconds: 5
  parquet_queue_capacity: 50000
  feature_parquet_batch_rows: 10000
  feature_parquet_flush_seconds: 5
  feature_parquet_queue_capacity: 50000
  feature_deduplication_capacity: 500000
  database_batch_rows: 500
  database_flush_seconds: 1

pipeline:
  consumer_queue_capacity: 10000
  backpressure_policy: "block"

logging:
  level: "INFO"
  json_output: true

replay:
  preserve_receive_timestamps: true
  default_speed: 1.0
  deterministic_seed: 20260723
