[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cvf-01"
version = "0.2.1"
description = "Cross-venue short-term flow research and paper-trading system"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "CVF-01 Contributors" }]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
    "pyarrow>=18,<26",
    "PyYAML>=6.0,<7",
    "websockets>=14,<17",
]

[project.optional-dependencies]
market-data = [
    "httpx>=0.27,<1",
    "websockets>=14,<17",
]
storage = [
    "SQLAlchemy>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "asyncpg>=0.30,<1",
    "pyarrow>=18,<26",
]
analytics = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
]
monitoring = [
    "streamlit>=1.41,<2",
]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
cvf = "cvf.main:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cvf = ["py.typed"]

[tool.setuptools.data-files]
"share/cvf-01" = ["config/default.yaml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cvf"]
